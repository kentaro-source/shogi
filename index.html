<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a2716">
<meta name="mobile-web-app-capable" content="yes">
<title>将棋盤</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">
  <section class="side" id="side-1" data-owner="1">
    <div class="hand" data-owner="1"></div>
    <div class="bar">
      <div class="turn"><span class="role"></span><span class="turn-label"></span><span class="check-label" hidden>王手</span></div>
      <div class="buttons">
        <button class="btn" data-act="undo">まった</button>
        <button class="btn" data-act="resign">まいりました</button>
        <button class="btn" data-act="menu">メニュー</button>
      </div>
    </div>
  </section>
  <div id="board-area"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <section class="side" id="side-0" data-owner="0">
    <div class="hand" data-owner="0"></div>
    <div class="bar">
      <div class="turn"><span class="role"></span><span class="turn-label"></span><span class="check-label" hidden>王手</span></div>
      <div class="buttons">
        <button class="btn" data-act="undo">まった</button>
        <button class="btn" data-act="resign">まいりました</button>
        <button class="btn" data-act="menu">メニュー</button>
      </div>
    </div>
  </section>
</div>
<div id="result-layer" hidden></div>
<div id="drag-layer"></div>
<div id="overlay-root"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
